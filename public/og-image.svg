<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TestWatt</title>
  <desc id="desc">Load bank testing and critical power services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f2748"/>
      <stop offset="100%" stop-color="#132f53"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="70" y="76" width="220" height="8" rx="4" fill="url(#accent)"/>
  <text x="70" y="205" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">TEST WATT</text>
  <text x="70" y="300" fill="#dfeaf8" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600">Load Bank Testing</text>
  <text x="70" y="360" fill="#dfeaf8" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600">Critical Power Services</text>
  <rect x="70" y="430" width="360" height="84" rx="42" fill="url(#accent)"/>
  <text x="112" y="485" fill="#0f2748" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Full-load proof. No paper rating.</text>
</svg>
